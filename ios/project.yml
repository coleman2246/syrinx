# XcodeGen input. The .xcodeproj is generated rather than committed: a
# pbxproj is thousands of lines of machine-managed UUIDs that no one can
# review, and it conflicts on every branch.
name: SyrinxDemo
options:
  bundleIdPrefix: space.aragonite
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  SyrinxDemo:
    type: application
    platform: iOS
    sources:
      - path: SyrinxDemo/Sources
    info:
      path: SyrinxDemo/Info.plist
      properties:
        # Populated from Local.xcconfig, which is gitignored. Empty in a clean
        # checkout, so the app falls back to its placeholder and the token is
        # never in the repository.
        SyrinxURL: $(SYRINX_URL)
        SyrinxToken: $(SYRINX_TOKEN)
    dependencies:
      # Built by crates/syrinx-ios/build-xcframework.sh.
      - framework: ../target/SyrinxCore.xcframework
        embed: false        # a static library is linked in, never embedded
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.aragonite.SyrinxDemo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Signed later by SideStore with your own Apple ID, so the build
        # itself needs no certificate and CI never holds credentials.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
