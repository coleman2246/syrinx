# XcodeGen input. The .xcodeproj is generated rather than committed: a
# pbxproj is thousands of lines of machine-managed UUIDs that no one can
# review, and it conflicts on every branch.
name: SyrinxDemo
options:
  bundleIdPrefix: space.aragonite
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  SyrinxDemo:
    type: application
    platform: iOS
    sources:
      - path: SyrinxDemo/Sources
      # The handoff is a contract between the two targets, so it is one file
      # compiled into both rather than a copy in each that can drift.
      - path: Shared
    dependencies:
      # Built by crates/syrinx-ios/build-xcframework.sh.
      - framework: ../target/SyrinxCore.xcframework
        embed: false        # a static library is linked in, never embedded
      - target: SyrinxKeyboard
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        # INFOPLIST_FILE, not XcodeGen's `info:` block. `info:` *generates* a
        # plist from the properties given and overwrites whatever is at that
        # path -- which silently dropped NSMicrophoneUsageDescription and left
        # an app that dies the moment it opens the microphone.
        INFOPLIST_FILE: SyrinxDemo/Info.plist
        CODE_SIGN_ENTITLEMENTS: SyrinxDemo/SyrinxDemo.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: space.aragonite.SyrinxDemo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Signed later by SideStore with your own Apple ID, so the build
        # itself needs no certificate and CI never holds credentials.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  SyrinxKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: SyrinxKeyboard
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SyrinxKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: SyrinxKeyboard/SyrinxKeyboard.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: space.aragonite.SyrinxDemo.Keyboard
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
