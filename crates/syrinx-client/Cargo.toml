[package]
name = "syrinx-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
syrinx-proto.workspace = true
syrinx-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
# rustls, with the platform trust store. Without a TLS feature a `wss://`
# URL parses and then fails at connect with "TLS support not compiled in",
# so this is what makes the address parser's wss support real. Native roots
# rather than bundled ones, so a private CA installed on the machine is
# trusted the same as a public one.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
toml_edit = "0.25"
toml = "0.9"
interprocess = "2.4.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifierItem tray. Pure D-Bus, which is what waybar consumes, and no
# GTK main loop to reconcile with eframe.
# "blocking" because the async API panics under eframe: zbus spawns its own
# thread and calls tokio::spawn from it, outside any runtime context.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target."cfg(windows)".dependencies]
global-hotkey = "0.8.0"
tray-icon = "0.24.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }
