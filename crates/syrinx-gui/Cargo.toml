[package]
name = "syrinx-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
syrinx-audio.workspace = true
syrinx-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = "0.36"
egui = "0.36"
toml = "0.9"
rfd = "0.16"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

# Gives syrinx-gui.exe its own icon in Explorer, which the viewport icon set at
# runtime cannot do. Windows-only, so nothing else pays for it -- see build.rs.
[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
