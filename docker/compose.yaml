# Deployment for a GPU host.
#
#   SYRINX_TOKEN=$(openssl rand -hex 24) docker compose -f docker/compose.yaml up -d
#
# The token comes from the environment; nothing secret is in this file or in
# the image.

services:
  syrinx:
    image: syrinx-server:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped

    environment:
      # Required. The service fails every request without it rather than
      # opening itself.
      SYRINX_TOKEN: ${SYRINX_TOKEN:?set SYRINX_TOKEN, e.g. $(openssl rand -hex 24)}

    volumes:
      # Read-only: the service loads models and has no business writing there.
      - ${SYRINX_MODELS:-/srv/syrinx/models}:/models:ro
      # The diarization models ride in this same mount, at $SYRINX_MODELS/diarize,
      # so speaker labels need no second volume: the ASR loader opens its four
      # files by name and an extra subdirectory beside them is invisible to it.
      # Keeping them elsewhere on the host is a second read-only mount at the
      # same container path:
      #   - ${SYRINX_DIARIZE_MODELS:-/srv/syrinx/diarize}:/models/diarize:ro
      # Either way docker/config.toml has to name the directory; see the note
      # there for why that cannot come from the environment.

    # Published on every interface by default: this is a LAN service, and other
    # machines on the LAN are the reason it exists. Access is gated on the
    # shared token, which fails closed when unset.
    #
    # That posture stops at the LAN. The transport is plaintext ws://, so the
    # token and the audio are readable by anything on the path -- see the
    # security note in the README before forwarding a port to this.
    #
    # Narrow it with SYRINX_LISTEN=127.0.0.1:8770 for a machine that only ever
    # talks to itself.
    ports:
      - "${SYRINX_LISTEN:-0.0.0.0:8770}:8770"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Nothing here needs to write to its own filesystem, gain privileges, or
    # keep any Linux capability.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Reachable by name from the TLS terminator over the compose network.
    networks:
      - syrinx

    healthcheck:
      # The binary probes itself: the image carries no curl or wget, and
      # /health needs no token, so nothing secret appears here.
      test: ["CMD", "/usr/local/bin/syrinx-server", "/etc/syrinx/config.toml", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  syrinx:
