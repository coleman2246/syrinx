# Baked-in defaults for the container.
#
# The token is deliberately not a usable value: it is supplied at run time
# through SYRINX_TOKEN. A real token here would be published to anyone who can
# pull the image.
bind = "0.0.0.0:8770"
token = "set-SYRINX_TOKEN"
model_dir = "/models"
provider = "cuda"

# Zero VRAM when idle. The GPU is shared with Frigate and Jellyfin, both of
# which fail visibly when starved, so the model is unloaded five minutes after
# the last session ends.
idle_unload_secs = 300

# Refuse to load rather than win an allocation race against the cameras.
vram_floor_mib = 1024
max_sessions = 4

# Speaker labels. Uncomment to turn them on, having put silero_vad.onnx and the
# embedding model in a `diarize` subdirectory of the mounted models directory
# (see docs/deploying.md). The image is already built with the feature, so this
# line and the two model files are the whole of it -- but the line has to be
# here rather than in the environment, because this setting says how the service
# behaves and only the deployment-varying ones are overridable. It is commented
# rather than set because a directory named here and not present is an error at
# every startup, which is not what to hand somebody who never wanted the
# feature.
#diarize_model_dir = "/models/diarize"

# The two calibrated numbers behind those labels, shown at their defaults and
# commented because the defaults are what was measured. The first is how many
# 560 ms chunks a commit waits for its label; the second is how many agreeing
# 1.5 s windows mint a new speaker. Lower is quicker and less sure in both
# cases, and out of range is refused at startup rather than at the first
# meeting. README, "Speaker labels", has the measurements.
#diarize_lag_chunks = 2
#diarize_min_pool = 4
