[workspace]
resolver = "3"
members = ["crates/syrinx-audio", "crates/syrinx-proto", "crates/syrinx-server", "crates/syrinx-gui", "crates/syrinx-client", "crates/syrinx-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syrinx-proto = { path = "crates/syrinx-proto" }
syrinx-audio = { path = "crates/syrinx-audio" }
syrinx-client = { path = "crates/syrinx-client" }
