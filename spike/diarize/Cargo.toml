[package]
name = "diarize-spike"
version = "0.1.0"
edition = "2024"

# Deliberately its own workspace: `spike/` is not a member of the syrinx
# workspace, and without this table cargo would adopt it from the parent
# directory and drag it into `cargo test --workspace`.
[workspace]

[dependencies]
anyhow = "1"
hound = "3"
rustfft = "6"
# Matches the version parakeet-rs pins (2.0.0-rc.13, confirmed via the
# workspace Cargo.lock). rc-series ort versions do not unify across majors,
# so Phase 2 has to coexist with exactly this one. No feature list: CPU
# execution is ort's built-in default, and the default features keep
# download-binaries, which is what lets this crate build without a
# hand-installed onnxruntime.
ort = "2.0.0-rc.13"

[profile.release]
debug = true
